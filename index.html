(()=>{'use strict';

const months=()=>Object.keys(S.months).sort();const nextMonth=m=>{let [y,mo]=m.split('-').map(Number);return new Date(Date.UTC(y,mo,1)).toISOString().slice(0,7)};const coverage=(b,m)=>/rent/i.test(b.name)?'For '+new Date(nextMonth(m)+'-01T12:00:00').toLocaleDateString('en-CA',{month:'long',year:'numeric'}):'';const amt=(c,m)=>{let d=mdata(m);return Math.max(0,balance(m))*((d.splitPct??80)/100)*c.weight/100};
function billDate(b,month){const max=new Date(+month.slice(0,4),+month.slice(5,7),0).getDate();return month+'-'+String(Math.min(max,b.day)).padStart(2,'0')}

function stats(month=S.month){let d=mdata(month),income=add(d.income),budget=add(d.budget),due=billsFor(month),billTotal=due.reduce((s,b)=>s+b.amount,0),used=new Set(d.payments.map(p=>p.billId));return{income,budget,billTotal,paid:due.filter(b=>used.has(b.id)).reduce((s,b)=>s+(d.payments.find(p=>p.billId===b.id)?.amount??b.amount),0),pending:due.filter(b=>!used.has(b.id)).reduce((s,b)=>s+b.amount,0)}}

}</option>`).join('')}</select></div><div class="pair"><div><label>Date</label><input id="entryDate" type="date" value="${S.month+'-'+String(period===1?5:20).padStart(2,'0')}"></div><div><label>Pay period</label><select id="entryPeriod"><option value="1" ${period===1?'selected':''}>First pay</option><option value="2" ${period===2?'selected':''}>Second pay</option></select></div></div><button class="btn" data-action="addentry">＋ Save entry</button></div><div class="row"><h2 style="margin:0">Transactions</h2><span class="pill">${items.length} entries</span></div><div class="card">${items.map(x=>compactItem(x.name,x.date,x.amount,x.kind,x.kind==='spending'?'Everyday':'')).join('')||'<div class="sm">No entries yet</div>'}</div><div class="card"><label>Opening / previous balance</label><input type="number" data-opening value="${d.opening||0}" step=".01"></div>`}
function bills(){let d=mdata(),bs=billsFor(S.month),st=stats(), selected=(S.selectedDay||S.month+'-01');if(!selected.startsWith(S.month))selected=S.month+'-01';let [y,mm]=S.month.split('-').map(Number),first=(new Date(y,mm-1,1).getDay()+6)%7,days=new Date(y,mm,0).getDate(),cells=Array.from({length:first},()=>'<div class="day empty"></div>');for(let day=1;day<=days;day++){let date=S.month+'-'+String(day).padStart(2,'0'),due=bs.filter(b=>billDate(b,S.month)===date),purchases=d.transactions.filter(t=>t.date===date);cells.push(`<button class="day ${selected===date?'selected':''}" data-day="${date}"><b>${day}</b>${due.length?'<i></i>':''}${purchases.length?'<i style="background:#8dbb9d"></i>':''}<small>${due.length||purchases.length?due.length+purchases.length+' items':''}</small></button>`)}let dayBills=bs.filter(b=>billDate(b,S.month)===selected),dayTx=d.transactions.filter(t=>t.date===selected),paid=b=>d.payments.find(p=>p.billId===b.id);return `<div class="grid"><div class="card hero"><div class="label">Still to pay</div><div class="value">${fmt(st.pending)}</div></div><div class="card"><div class="label">Paid bills</div><div class="value">${fmt(st.paid)}</div></div></div><div class="card"><div class="row"><b>📅 ${new Date(S.month+'-01T12:00').toLocaleDateString('en-CA',{month:'long',year:'numeric'})}</b><span class="sm">● due · <span style="color:#8dbb9d">●</span> purchase</span></div><div class="calendar">${['M','T','W','T','F','S','S'].map(n=>`<div class="sm">${n}</div>`).join('')}${cells.join('')}</div></div><div class="card"><h2 style="margin-top:0">${selected}</h2>${dayBills.map(b=>`<div class="item"><input type="checkbox" data-paid="${safe(b.id)}" ${paid(b)?'checked':''}><div style="flex:1"><b>${safe(b.name)}</b><div class="sm">${paid(b)?'Paid':'Pending'} · ${fmt(b.amount)} ${coverage(b,S.month)?' · '+coverage(b,S.month):''}</div></div><button class="quiet" data-editbill="${safe(b.id)}">✎</button></div>`).join('')}${dayTx.map(t=>compactItem(t.name,t.date,t.amount,'expense','Purchase')).join('')}${!dayBills.length&&!dayTx.length?'<div class="sm">No activity on this day</div>':''}</div><div class="row"><h2 style="margin:0">All scheduled bills</h2><button class="ghost" data-action="showbill">＋ Add bill</button></div><div class="card">${bs.slice().sort((a,b)=>a.day-b.day).map(b=>`<div class="item"><input type="checkbox" data-paid="${safe(b.id)}" ${paid(b)?'checked':''}><div style="flex:1"><b>${safe(b.name)}</b><div class="sm">Every ${b.day}${b.repeat?' · Monthly':' · One-time'} ${b.end?' · Until '+b.end:''} ${coverage(b,S.month)?' · '+coverage(b,S.month):''}</div></div><div style="text-align:right"><div class="amount">${fmt(b.amount)}</div><button class="quiet" data-editbill="${safe(b.id)}">Edit</button></div></div>`).join('')}</div><div class="card hidden" id="billEditor"><h2 style="margin-top:0" id="billEditorHeading">Schedule bill</h2><input type="hidden" id="billId"><label>Bill name</label><div class="sm">Rent paid this month is labeled for the following month.</div><input id="billName" placeholder="e.g. Internet"><div class="pair"><div><label>Amount</label><input id="billAmount" type="number" step=".01" min="0"></div><div><label>Due day</label><input id="billDay" type="number" min="1" max="31" value="1"></div></div><label class="switchline"><input id="billRepeat" type="checkbox" checked> Repeat monthly</label><label>Final payment date (optional)</label><input id="billEnd" type="date"><div class="row"><button class="btn" data-action="savebill">Save bill</button><button class="quiet" data-action="deletebill">Delete</button></div></div>`}
function splitView(){let d=mdata(),available=balance(),sp=split(),valid=S.categories.filter(c=>c.type==='savings'),total=valid.reduce((s,c)=>s+(+c.weight||0),0);return `<div class="card hero"><div class="label">${title('available')}</div><div class="money">${fmt(available)}</div><div class="sm">${title('income')} ${fmt(stats().income)} · Bills + expenses ${fmt(stats().billTotal+stats().budget)}</div></div><div class="card"><h2 style="margin-top:0">Choose your split ✿</h2><div class="tabs">${[50,60,70,80,90].map(n=>`<button class="ghost ${d.splitPct===n?'on':''}" data-preset="${n}">${n}%</button>`).join('')}</div><input aria-label="Savings percentage" id="splitSlider" type="range" min="0" max="100" step="1" value="${d.splitPct}"><div class="row"><b>🌿 ${title('savings')} ${d.splitPct}%</b><b>🍓 ${title('spending')} ${100-d.splitPct}%</b></div><div class="grid"><div class="card" style="background:#e7f1e7"><div class="label">Savings</div><div class="value">${fmt(sp.save)}</div></div><div class="card" style="background:#f8e9f0"><div class="label">Pocket money</div><div class="value">${fmt(sp.pocket)}</div></div></div></div><div class="row"><h2 style="margin:0">Savings jars 🌷</h2><span class="pill" style="color:${total===100?'#527760':'#b34763'}">${total}% allocated</span></div><div class="card">${valid.map(c=>`<div class="item"><span style="font-size:22px">${safe(c.emoji||'🌸')}</span><div style="flex:1"><b>${safe(c.name)}</b><div class="sm">${fmt(amt(c,S.month))}</div></div><div style="width:74px"><input type="number" min="0" step="1" data-weight="${safe(c.id)}" value="${c.weight}" aria-label="${safe(c.name)} percentage"></div><span class="sm">%</span></div>`).join('')}</div><button class="ghost" data-tab="overview">View your dashboard →</button>`}
let chartMode='expenses',chartDrill='';

function expenseGroup(name){let n=(name||'').toLowerCase();if(/\bcc\b|credit card|walmart|costco/.test(n))return 'Credit Cards';if(/rent/.test(n))return 'Rent';if(/phone|mobile|internet/.test(n))return 'Phone & Internet';if(/car insurance|insurance/.test(n))return 'Insurance';if(/gas|fuel|petrol/.test(n))return 'Gas & Transport';if(/gym|fitness/.test(n))return 'Gym & Fitness';if(/necklace|jewelry/.test(n))return 'Installments';if(/tax/.test(n))return 'Taxes';if(/grocery|groceries/.test(n))return 'Groceries';let c=S.categories.find(c=>c.type==='expense'&&c.name.toLowerCase()===n);return c?.name||'Other Expenses'}
function moneyChart(){let st=stats(),sp=split(),d=mdata(),expenses=st.budget+st.billTotal,options=[['expenses','🧾 Expenses'],['savings','🌿 Savings'],['spending','🍓 Pocket money']];
let raw=[];
if(chartMode==='expenses'){
 const all=[...d.budget.map(x=>({name:x.name,amount:+x.amount||0,source:'Budget'})),...billsFor(S.month).map(x=>({name:x.name,amount:+x.amount||0,source:'Bill'}))];
 if(chartDrill)raw=all.filter(x=>expenseGroup(x.name)===chartDrill).map(x=>({name:x.name,amount:x.amount}));
 else {const totals=new Map();for(const x of all){let k=expenseGroup(x.name);totals.set(k,(totals.get(k)||0)+x.amount)}raw=[...totals].map(([name,amount])=>({name,amount,drill:true}));}
}else if(chartMode==='savings'){

}else{

}

raw.forEach((x,i)=>{let to=angle+(x.amount/denom)*100;stops.push(`${chartColors[i%chartColors.length]} ${angle.toFixed(4)}% ${to.toFixed(4)}%`);angle=to});
let chartBg=stops.length?`conic-gradient(${stops.join(',')})`:'#efe9ed';
return `<div class="card"><div class="chart-choice">${options.map(([key,label])=>`<button class="ghost ${chartMode===key?'active':''}" data-chartmode="${key}">${label}</button>`).join('')}</div>${chartDrill&&chartMode==='expenses'?`<button class="chart-back" data-chartback="1">← All expenses</button><div class="subhead">${safe(chartDrill)}</div>`:''}<div class="chart-donut" style="background:${chartBg}"><div class="chart-center"><small>${chartMode==='expenses'?(chartDrill?chartDrill:'Expenses'):chartMode==='savings'?'Planned savings':'Pocket money'}</small><b>${fmt(total)}</b></div></div><div class="chart-list">${raw.map((x,i)=>`<button class="chart-row" ${chartMode==='expenses'&&!chartDrill&&x.drill?'data-chartdrill="'+safe(x.name)+'"':''}><span><i class="dot" style="background:${chartColors[i%chartColors.length]}"></i><b>${safe(x.name)}</b>${chartMode==='expenses'&&!chartDrill?' ›':''}</span><span class="chart-number"><b>${fmt(x.amount)}</b><small>${total>0?(x.amount/total*100).toFixed(1):'0.0'}%</small></span></button>`).join('')||'<div class="sm">No entries for this month yet</div>'}</div></div>`}
function overview(){let st=stats(),sp=split(),spent=spentPocket(),transfer=months().reduce((v,m)=>v+mdata(m).transfers.reduce((a,t)=>a+t.amount,0),0);let parts={Summary:`<div class="grid"><div class="card"><div class="label">${title('income')}</div><div class="value">${fmt(st.income)}</div></div><div class="card"><div class="label">${title('expenses')} + bills</div><div class="value">${fmt(st.budget+st.billTotal)}</div></div><div class="card"><div class="label">Savings planned</div><div class="value">${fmt(sp.save)}</div></div><div class="card"><div class="label">${title('spending')}</div><div class="value">${fmt(sp.pocket)}</div></div></div>`, 'Money chart':moneyChart(), 'Spending left':`<div class="card hero"><div class="label">Pocket money left</div><div class="money">${fmt(sp.pocket-spent)}</div><div class="bar"><i style="width:${sp.pocket>0?Math.min(100,spent/sp.pocket*100):0}%"></i></div><div class="sm">${fmt(spent)} spent / ${fmt(sp.pocket)} planned</div></div>`, 'Savings jars':`<div class="card"><div class="row"><b>Actual savings across months</b><b>${fmt(transfer)}</b></div>${S.categories.filter(c=>c.type==='savings').map(c=>`<div class="item"><span>${safe(c.emoji)} ${safe(c.name)}</span><b>${fmt(fundBalance(c))}</b></div>`).join('')}</div>`, 'Monthly trends':`<div class="card">${months().map(m=>{let s=stats(m),tr=mdata(m).transfers.reduce((a,t)=>a+t.amount,0);return `<div class="item"><div><b>${m}</b><div class="sm">Income ${fmt(s.income)} · Expenses ${fmt(s.budget+s.billTotal)}</div></div><b>${fmt(tr)} saved</b></div>`}).join('')}</div>`};return `<div class="card hero"><div class="label">${title('available')}</div><div class="money">${fmt(balance())}</div></div>${S.layout.map(k=>`<h2>${safe(S.sectionLabels?.[k]||k)}</h2>${parts[k]||''}`).join('')}`}
function more(){return `<div class="card"><h2 style="margin:0">Personalize ✨</h2><label>App name</label><input data-appname value="${safe(S.name)}"><div class="pair"><div><label>Accent color</label><input type="color" data-color value="${safe(S.color)}"></div><div><label>Font</label><select data-font><option value="system" ${S.font==='system'?'selected':''}>Minimal</option><option value="round" ${S.font==='round'?'selected':''}>Cute round</option><option value="classic" ${S.font==='classic'?'selected':''}>Classic</option></select></div></div><h2>Rename tabs & dashboard cards</h2>${Object.entries(S.labels).map(([key,value])=>`<div class="settings-row"><span class="sm">${safe(key)}</span><input data-label="${safe(key)}" value="${safe(value)}"></div>`).join('')}</div><div class="card"><h2 style="margin-top:0">Savings & expense categories</h2>${S.categories.map(c=>`<div class="item"><div style="flex:1"><input data-catname="${safe(c.id)}" value="${safe(c.name)}"></div><div style="width:114px"><select data-cattype="${safe(c.id)}">${['savings','expense','spending'].map(t=>`<option value="${t}" ${t===c.type?'selected':''}>${t}</option>`).join('')}</select></div><button class="quiet" data-delcat="${safe(c.id)}">×</button></div>`).join('')}<button class="ghost" data-action="addcat">＋ Category</button></div><div class="card"><h2 style="margin-top:0">Dashboard titles & arrangement</h2>${S.layout.map((x,i)=>`<div class="row"><div style="flex:1"><div class="sm">${safe(x)}</div><input data-section="${safe(x)}" value="${safe(S.sectionLabels?.[x]||x)}"></div><span><button class="quiet" data-move="${i}" data-dir="-1">↑</button> <button class="quiet" data-move="${i}" data-dir="1">↓</button></span></div>`).join('')}</div><div class="card" id="shared-account-card"><h2 style="margin-top:0">Shared household ☁️</h2><div id="shared-ui">Cloud setup needed. Local mode is ready.</div></div><div class="card"><h2 style="margin-top:0">Backup & sharing</h2><div class="row"><button class="btn" data-action="export">Export data</button><button class="ghost" data-action="reset">Reset demo</button></div><label>Import your or your partner's backup</label><input id="import" type="file" accept="application/json"><div class="sm">Share a backup file with Ronnie; this version does not sync live between phones.</div></div>`}
const pages={cash,bills,split:splitView,overview,more},tabs=[['cash','＋'],['bills','▦'],['split','◕'],['overview','⌂'],['more','⚙']];
function render(){save();$('#appTitle').textContent=S.name;document.title=S.name;$('#monthPicker').value=S.month;document.documentElement.style.setProperty('--rose',S.color);document.body.classList.toggle('font-round',S.font==='round');document.body.classList.toggle('font-classic',S.font==='classic');$('#nav').innerHTML=tabs.map(([key,icon])=>`<button data-tab="${key}" class="${S.tab===key?'on':''}"><span>${icon}</span>${title(key)}</button>`).join('');$('#view').innerHTML=pages[S.tab]();if(window.BloomCloud?.refresh)window.BloomCloud.refresh();}
function billEditor(b){let e=$('#billEditor');e.classList.remove('hidden');$('#billId').value=b?.id||'';$('#billEditorHeading').textContent=b?'Edit bill':'Add bill';$('#billName').value=b?.name||'';$('#billAmount').value=b?.amount||'';$('#billDay').value=b?.day||1;$('#billRepeat').checked=b?b.repeat:true;$('#billEnd').value=b?.end||'';e.scrollIntoView({behavior:'smooth',block:'nearest'})}
function download(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='bloom-budget-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function action(k){if(k==='addentry'){let kind=$('#entryType').value,name=$('#entryName').value.trim(),amount=Number($('#entryAmount').value),date=$('#entryDate').value,period=Number($('#entryPeriod').value),d=mdata();if(!date||!Number.isFinite(amount)||amount<=0)return toast('Add amount and date');if(kind!=='transfer'&&!name)return toast('Add a name');let base={id:uid(),name,amount,date,period};if(kind==='income')d.income.push(base);else if(kind==='budget')d.budget.push(base);else if(kind==='spending')d.transactions.push({...base,kind:'spending'});else d.transfers.push({id:uid(),categoryId:$('#entryFund').value,amount,date,period});toast('Added ✿')}
else if(k==='showbill'){billEditor(null);return}
else if(k==='savebill'){let id=$('#billId').value,name=$('#billName').value.trim(),amount=Number($('#billAmount').value),day=Number($('#billDay').value),repeat=$('#billRepeat').checked,end=$('#billEnd').value;if(!name||!(amount>0)||day<1||day>31)return toast('Complete the bill details');let b=S.bills.find(x=>x.id===id),o={name,amount,day,repeat,end,oneMonth:repeat?'':S.month};if(b)Object.assign(b,o);else S.bills.push({id:uid(),...o,activeFrom:S.month});toast('Bill saved')}
else if(k==='deletebill'){let id=$('#billId').value;if(!id)return;S.bills=S.bills.filter(x=>x.id!==id);for(let m of months())mdata(m).payments=mdata(m).payments.filter(x=>x.billId!==id);toast('Bill deleted')}
else if(k==='addcat'){S.categories.push({id:uid(),name:'New category',type:'expense',weight:0,emoji:'🌸',goal:0})}
else if(k==='export'){download();return}
else if(k==='reset'){if(!confirm('Clear all saved data and restore sample?'))return;S=structuredClone(initial);toast('Restored sample')}
render()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){S.tab=b.dataset.tab;render();return}if(b.dataset.chartmode){chartMode=b.dataset.chartmode;chartDrill='';render();return}if(b.dataset.chartback){chartDrill='';render();return}if(b.dataset.chartdrill){chartDrill=b.dataset.chartdrill;render();return}if(b.dataset.period){S.period=Number(b.dataset.period);render();return}if(b.dataset.day){S.selectedDay=b.dataset.day;render();return}if(b.dataset.preset){mdata().splitPct=Number(b.dataset.preset);render();return}if(b.dataset.action){action(b.dataset.action);return}if(b.dataset.editbill){billEditor(S.bills.find(x=>x.id===b.dataset.editbill));return}if(b.dataset.delcat){if(confirm('Delete this category? Existing savings history stays in the backup but may not appear.')){S.categories=S.categories.filter(c=>c.id!==b.dataset.delcat);render()}return}if(b.dataset.move){let i=Number(b.dataset.move),j=i+Number(b.dataset.dir);if(j>=0&&j<S.layout.length){[S.layout[i],S.layout[j]]=[S.layout[j],S.layout[i]];render()}}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(t.id==='monthPicker'){if(!/^\d{4}-\d{2}$/.test(t.value))return;S.month=t.value;mdata();S.selectedDay=S.month+'-01';chartDrill=''}else if(t.id==='entryType'){let trans=t.value==='transfer';$('#entryName').classList.toggle('hidden',trans);$('#nameLabel').classList.toggle('hidden',trans);$('#fundSelect').classList.toggle('hidden',!trans);return}else if(d.paid!==undefined){let m=mdata(),b=S.bills.find(x=>x.id===d.paid);m.payments=m.payments.filter(x=>x.billId!==d.paid);if(t.checked&&b)m.payments.push({billId:b.id,amount:b.amount,date:S.month+'-'+String(Math.min(b.day,new Date(+S.month.slice(0,4),+S.month.slice(5,7),0).getDate())).padStart(2,'0')})}
else if(t.id==='splitSlider'){mdata().splitPct=Number(t.value)}else if(d.weight){let c=S.categories.find(c=>c.id===d.weight);if(c)c.weight=Math.max(0,Number(t.value)||0)}else if(d.opening!==undefined){mdata().opening=Number(t.value)||0}else if(d.appname!==undefined){S.name=t.value.trim()||'Bloom Budget'}else if(d.label){S.labels[d.label]=t.value.trim()||d.label}else if(d.section){S.sectionLabels=S.sectionLabels||{};S.sectionLabels[d.section]=t.value.trim()||d.section}else if(d.color!==undefined){S.color=t.value}else if(d.font!==undefined){S.font=t.value}else if(d.catname){let c=S.categories.find(x=>x.id===d.catname);if(c)c.name=t.value}else if(d.cattype){let c=S.categories.find(x=>x.id===d.cattype);if(c)c.type=t.value}else if(t.id==='import'&&t.files[0]){let r=new FileReader;r.onload=()=>{try{let v=JSON.parse(r.result);if(!v.months||!v.categories||!v.bills)throw Error('bad');S=v;render();toast('Backup imported')}catch{toast('Invalid backup')}};r.readAsText(t.files[0]);return}else return;render()});
window.BloomBridge={getState:()=>structuredClone(S),applyRemote:obj=>{if(!obj||!obj.months||!obj.categories||!obj.bills)return;S=structuredClone(obj);for(const k of Object.keys(initial))if(S[k]===undefined)S[k]=structuredClone(initial[k]);render()},notify:toast};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();</script><script src="firebase-config.js"></script><script type="module" src="shared.js"></script></body></html>
