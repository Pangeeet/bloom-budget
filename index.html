</style></head><body><main><div class="top"><div><div class="over">✿ OUR MONEY SPACE</div><h1 id="appTitle">Bloom Budget</h1></div><input id="monthPicker" type="month" aria-label="Selected month"></div><div id="view"></div></main><nav class="nav"><div class="nav-inner" id="nav"></div></nav><div class="toast" id="toast"></div><div class="bloom-overlay hidden" id="bloomModal" role="dialog" aria-modal="true"><div class="bloom-sheet" id="bloomSheet"></div></div><script>
(()=>{'use strict';
const KEY='bloom-budget-v7', oldKey='bloom-budget-v1';
const uid=()=>Math.random().toString(36).slice(2,11);
const today=()=>new Date().toISOString().slice(0,10);
const defaultCats=[['Investment','savings',25,'🌱'],['Car Maintenance','savings',15,'🚘'],['Emergency','savings',30,'🛟'],['Family','savings',10,'🏡'],['Ronnie','savings',5,'☁️'],['Angel','savings',5,'🌸'],['Ethan','savings',5,'⭐'],['Holidays','savings',5,'🎄'],['Shopping','spending',0,'🛍️'],['Groceries','expense',0,'🛒'],['Transport','expense',0,'🚎'],['Coffee','spending',0,'☕']].map(([name,type,weight,emoji])=>({id:uid(),name,type,weight,emoji,goal:0}));
const presets=[['Rent (for next month)',1700,1,1,''],['Car Insurance',314,13,1,''],['Necklace',214,12,1,''],['Phone Bill',55,20,1,''],['Angel Phone Line',55,22,1,''],['Ronnie Phone Line',32,22,1,''],['Gas · Mid-month',100,15,1,''],['Gas · Month-end',100,28,1,''],['Gym Membership',31,30,1,'']].map(([name,amount,day,repeat,end])=>({id:uid(),name,amount,day,repeat:!!repeat,end,activeFrom:'2026-11'}));
const sample={income:[{id:uid(),name:'Income A',amount:2700,date:'2026-11-05',period:1},{id:uid(),name:'Income R',amount:1500,date:'2026-11-19',period:2},{id:uid(),name:'Income A',amount:1500,date:'2026-11-19',period:2}],budget:[['CC Ronnie',1190,1],['CC Walmart',500,1],['CC Costco',200,1],['Tax Due',360,1]].map(([name,amount,period])=>({id:uid(),name,amount,period,date:'2026-11-08'})),transactions:[],payments:[],transfers:[],splitPct:80,opening:0};
const initial={month:'2026-11',tab:'overview',period:1,selectedDay:today(),categories:defaultCats,bills:presets,months:{'2026-11':sample},name:'Bloom Budget',labels:{cash:'Cash Flow',bills:'Bills & Calendar',split:'Money Split',overview:'Overview',more:'More',income:'Total income',expenses:'Budgeted expenses',available:'Ready to split',savings:'Savings & funds',spending:'Pocket money'},color:'#b57e9a',font:'system',sectionLabels:{},layout:['Spending left','Summary','Money chart','Savings jars','Monthly trends']};
let S;try{S=JSON.parse(localStorage.getItem(KEY))||null}catch{}if(!S)S=structuredClone(initial);
for(const k of Object.keys(initial))if(S[k]===undefined)S[k]=structuredClone(initial[k]);
if(!S.v11LayoutApplied){S.layout=['Spending left',...S.layout.filter(x=>x!=='Spending left')];S.tab='overview';S.v11LayoutApplied=true;}
const $=q=>document.querySelector(q),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Number(n)||0),add=xs=>xs.reduce((a,x)=>a+(Number(x.amount)||0),0),mdata=(m=S.month)=>S.months[m]||(S.months[m]={income:[],budget:[],transactions:[],payments:[],transfers:[],splitPct:80,opening:0});
const months=()=>Object.keys(S.months).sort();const nextMonth=m=>{let [y,mo]=m.split('-').map(Number);return new Date(Date.UTC(y,mo,1)).toISOString().slice(0,7)};const coverage=(b,m)=>/rent/i.test(b.name)?'For '+new Date(nextMonth(m)+'-01T12:00:00').toLocaleDateString('en-CA',{month:'long',year:'numeric'}):'';const amt=(c,m)=>{let d=mdata(m);return Math.max(0,balance(m))*((d.splitPct??80)/100)*c.weight/100};
function billDate(b,month){const max=new Date(+month.slice(0,4),+month.slice(5,7),0).getDate();return month+'-'+String(Math.min(max,b.day)).padStart(2,'0')}
function billsFor(month){return S.bills.filter(b=>(!b.activeFrom||month>=b.activeFrom)&&(!b.end||billDate(b,month)<=b.end)&&(!b.oneMonth||b.oneMonth===month))}
function stats(month=S.month){let d=mdata(month),income=add(d.income),budget=add(d.budget),due=billsFor(month),billTotal=due.reduce((s,b)=>s+b.amount,0),used=new Set(d.payments.map(p=>p.billId));return{income,budget,billTotal,paid:due.filter(b=>used.has(b.id)).reduce((s,b)=>s+(d.payments.find(p=>p.billId===b.id)?.amount??b.amount),0),pending:due.filter(b=>!used.has(b.id)).reduce((s,b)=>s+b.amount,0)}}
function previousMonth(m){const [y,mm]=m.split('-').map(Number);return new Date(Date.UTC(y,mm-2,1)).toISOString().slice(0,7)}
function carryForward(m,depth=0){if(depth>120)return 0;const prev=previousMonth(m);if(!S.months[prev])return 0;return remainingCash(prev,depth+1)}
function remainingCash(m,depth=0){const d=S.months[m];if(!d||depth>120)return 0;const st=stats(m);const opening=d.carryEnabled?carryForward(m,depth+1):Number(d.opening)||0;const extras=add(d.transactions||[]);const transfers=add(d.transfers||[]);return opening+st.income-st.budget-st.billTotal-extras-transfers}
function openingFor(m){const d=mdata(m);return d.carryEnabled?carryForward(m):Number(d.opening)||0}
function balance(month=S.month){let st=stats(month);return st.income+openingFor(month)-st.budget-st.billTotal}
function split(month=S.month){let available=Math.max(0,balance(month)),p=(mdata(month).splitPct??80)/100;return {save:available*p,pocket:available*(1-p)}}
function spentPocket(month=S.month){return add(mdata(month).transactions.filter(x=>x.kind==='spending'))}
function fundBalance(cat){return months().reduce((s,m)=>s+mdata(m).transfers.filter(t=>t.categoryId===cat.id).reduce((a,t)=>a+t.amount,0),0)}
function toast(t){let n=$('#toast');n.textContent=t;n.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.style.display='none',2100)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{} if(window.BloomCloud?.queueSave)window.BloomCloud.queueSave(S)}
function title(s){return safe(S.labels[s]||s)}
function compactItem(name,date,amount,kind='',right=''){return `<div class="item"><div><div class="name">${safe(name)}</div><div class="sm">${safe(date)} ${right? '· '+safe(right):''}</div></div><div class="amount" style="color:${kind==='income'?'#4c8866':'inherit'}">${kind==='income'?'+':'−'}${fmt(amount)}</div></div>`}
const monthLabel=m=>new Date(m+'-01T12:00:00').toLocaleDateString('en-CA',{month:'short',year:'numeric'});
const humanDate=date=>date?new Date(date+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}):'No date';
function entryRow(x,kind){const incoming=kind==='income'||kind==='transfer'&&x.amount>0;return `<div class="item"><div style="flex:1;min-width:0"><div class="name">${safe(x.name||S.categories.find(c=>c.id===x.categoryId)?.name||'Entry')}</div><div class="sm">${humanDate(x.date)} · ${kind==='budget'?'Expense':kind==='transfer'?'Savings':kind==='income'?'Income':'Purchase'}</div></div><span class="amount ${incoming?'income':'expense'}">${incoming?'+':'−'}${fmt(Math.abs(x.amount))}</span><div class="bloom-actions"><button class="micro" data-editentry="${safe(x.id)}" data-entrykind="${kind}" aria-label="Edit entry">Edit</button><button class="micro danger" data-removeentry="${safe(x.id)}" data-entrykind="${kind}" aria-label="Delete entry">Delete</button></div></div>`}
function sectionHeader(key){return `<div class="blockhead"><h2><button class="tap-title" data-rename-section="${safe(key)}" title="Tap to rename">${safe(S.sectionLabels?.[key]||key)} ✎</button></h2><div class="bloom-actions"><button class="micro" data-shiftsection="${safe(key)}" data-where="-1" title="Move up">↑</button><button class="micro" data-shiftsection="${safe(key)}" data-where="1" title="Move down">↓</button></div></div>`}
function openSheet(title,html){let el=$('#bloomModal'),slot=$('#bloomSheet');slot.innerHTML=`<div class="modalhead"><h2>${safe(title)}</h2><button class="micro" data-closemodal="1" aria-label="Close">✕</button></div>`+html;el.classList.remove('hidden');slot.querySelector('input:not([type=hidden]),select,button')?.focus({preventScroll:true})}
function closeSheet(){$('#bloomModal').classList.add('hidden');$('#bloomSheet').innerHTML=''}
function formEntry(kind='budget',item=null){const names={income:'Income',budget:'Budgeted expense',spending:'Everyday purchase',transfer:'Savings transfer'};let when=item?.date||S.month+'-'+String(S.period===1?5:20).padStart(2,'0');openSheet(item?'Edit '+(names[kind]||'entry'):'New transaction',`<input type="hidden" id="modalEntryId" value="${safe(item?.id||'')}"><div class="pair"><div><label>Type</label><select id="entryType">${Object.entries(names).map(([k,v])=>`<option value="${k}" ${kind===k?'selected':''}>${v}</option>`).join('')}</select></div><div><label>Amount</label><input type="number" id="entryAmount" min="0" step="0.01" value="${item?.amount??''}" placeholder="0.00"></div></div><div id="modalEntryName"><label>Title / type</label><input id="entryName" value="${safe(item?.name||'')}" placeholder="e.g. Salary, coffee, groceries"></div><div id="fundSelect" class="${kind==='transfer'?'':'hidden'}"><label>Savings jar</label><select id="entryFund">${S.categories.filter(c=>c.type==='savings').map(c=>`<option value="${safe(c.id)}" ${item?.categoryId===c.id?'selected':''}>${safe(c.name)}</option>`).join('')}</select></div><div class="pair"><div><label>Date</label><input id="entryDate" type="date" value="${safe(when)}"></div><div><label>Pay period</label><select id="entryPeriod"><option value="1" ${item?.period===1||!item&&S.period===1?'selected':''}>First pay</option><option value="2" ${item?.period===2||!item&&S.period===2?'selected':''}>Second pay</option></select></div></div><div class="modalbuttons"><button class="btn" data-action="addentry">${item?'Save changes':'Add entry'}</button><button class="quiet" data-closemodal="1">Cancel</button></div>`);}
function editCategory(id){let c=S.categories.find(x=>x.id===id);if(!c)return;openSheet('Edit category',`<label>Category name</label><input id="categoryName" value="${safe(c.name)}"><label>Category type</label><select id="categoryType">${['savings','expense','spending','bills'].map(k=>`<option value="${k}" ${c.type===k?'selected':''}>${k}</option>`).join('')}</select><div class="pair"><div><label>Emoji</label><input id="categoryEmoji" value="${safe(c.emoji||'🌷')}"></div><div><label>Jar percentage</label><input type="number" min="0" id="categoryWeight" value="${c.weight||0}"></div></div><div class="modalbuttons"><button class="btn" data-savecategory="${safe(id)}">Save</button><button class="quiet" data-closemodal="1">Cancel</button></div>`)}
function cash(){let d=mdata(),st=stats();let all=[...d.income.map(x=>({...x,kind:'income'})),...d.budget.map(x=>({...x,kind:'budget'})),...d.transactions.map(x=>({...x,kind:'spending'})),...d.transfers.map(x=>({...x,kind:'transfer'}))];all=all.filter(x=>S.period===0||x.period===S.period).sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<div class="card hero"><div class="label">Cash flow · ${monthLabel(S.month)}</div><div class="money">${fmt(balance())}</div><div class="mini-total"><div class="card"><div class="label">Total income</div><div class="value" style="color:var(--in)">${fmt(st.income)}</div></div><div class="card"><div class="label">Bills + expenses</div><div class="value" style="color:var(--out)">${fmt(st.budget+st.billTotal)}</div></div></div></div><div class="row"><div class="filter-row">${[[0,'All pay periods'],[1,'First pay'],[2,'Second pay']].map(([n,t])=>`<button class="${S.period===n?'btn':'ghost'}" data-period="${n}">${t}</button>`).join('')}</div></div><div class="row"><b>Transactions · Latest first</b><button class="btn" data-newentry="budget">＋ Add</button></div><div class="card">${all.map(x=>entryRow(x,x.kind)).join('')||'<span class="sm">Nothing recorded yet</span>'}</div><div class="card"><div class="row" style="gap:10px"><div style="flex:1"><b>Carry over last month</b><div class="sm">${monthLabel(previousMonth(S.month))} → ${monthLabel(S.month)}</div></div><label class="carry-switch"><input type="checkbox" data-carry="1" ${d.carryEnabled?'checked':''} aria-label="Carry over last month remaining balance"><span></span></label></div><div class="row"><span class="sm">${d.carryEnabled?'Calculated previous-month remainder':'Carryover not included'}</span><b>${fmt(d.carryEnabled?carryForward(S.month):0)}</b></div>${d.carryEnabled&&!S.months[previousMonth(S.month)]?'<div class="sm">No previous month entered yet</div>':''}<div class="sm">Based on planned bills and recorded purchases / savings transfers</div></div>`}
function bills(){let d=mdata(),bs=billsFor(S.month),st=stats(), selected=(S.selectedDay||S.month+'-01');if(!selected.startsWith(S.month))selected=S.month+'-01';let [y,mm]=S.month.split('-').map(Number),first=(new Date(y,mm-1,1).getDay()+6)%7,days=new Date(y,mm,0).getDate(),cells=Array.from({length:first},()=>'<div class="day empty"></div>');for(let day=1;day<=days;day++){let date=S.month+'-'+String(day).padStart(2,'0'),due=bs.filter(b=>billDate(b,S.month)===date),purchases=d.transactions.filter(t=>t.date===date);cells.push(`<button class="day ${selected===date?'selected':''}" data-day="${date}"><b>${day}</b>${due.length?'<i></i>':''}${purchases.length?'<i style="background:#8dbb9d"></i>':''}<small>${due.length||purchases.length?due.length+purchases.length+' items':''}</small></button>`)}let dayBills=bs.filter(b=>billDate(b,S.month)===selected),dayTx=d.transactions.filter(t=>t.date===selected),paid=b=>d.payments.find(p=>p.billId===b.id);return `<div class="row"><b>Due soon</b><span class="pill">Upcoming payments</span></div><div class="card">${bs.filter(b=>!d.payments.some(p=>p.billId===b.id)).sort((a,b)=>a.day-b.day).slice(0,4).map(b=>`<div class="item"><span>📌</span><div style="flex:1"><b>${safe(b.name)}</b><div class="sm">${humanDate(billDate(b,S.month))}</div></div><b>${fmt(b.amount)}</b></div>`).join('')||'<span class="sm">All set!</span>'}</div><div class="grid"><div class="card hero"><div class="label">Still to pay</div><div class="value">${fmt(st.pending)}</div></div><div class="card"><div class="label">Paid bills</div><div class="value">${fmt(st.paid)}</div></div></div><div class="card"><div class="row"><b>📅 ${new Date(S.month+'-01T12:00').toLocaleDateString('en-CA',{month:'long',year:'numeric'})}</b><span class="sm">● due · <span style="color:#8dbb9d">●</span> purchase</span></div><div class="calendar">${['M','T','W','T','F','S','S'].map(n=>`<div class="sm">${n}</div>`).join('')}${cells.join('')}</div></div><div class="card"><h2 style="margin-top:0">${selec function expenseGroup(name){let n=(name||'').toLowerCase();if(/\bcc\b|credit card|walmart|costco/.test(n))return 'Credit Cards';if(/rent/.test(n))return 'Rent';if(/phone|mobile|internet/.test(n))return 'Phone & Internet';if(/car insurance|insurance/.test(n))return 'Insurance';if(/gas|fuel|petrol/.test(n))return 'Gas & Transport';if(/gym|fitness/.test(n))return 'Gym & Fitness';if(/necklace|jewelry/.test(n))return 'Installments';if(/tax/.test(n))return 'Taxes';if(/grocery|groceries/.test(n))return 'Groceries';let c=S.categories.find(c=>c.type==='expense'&&c.name.toLowerCase()===n);return c?.name||'Other Expenses'}
function moneyChart(){let st=stats(),sp=split(),d=mdata(),expenses=st.budget+st.billTotal,options=[['all','✨ Overall'],['expenses','🧾 Expenses'],['savings','🌿 Savings'],['spending','🍓 Pocket money']];
let raw=[];
if(chartMode==='all'){raw=[{name:'Expenses + bills',amount:expenses},{name:'Planned savings',amount:sp.save}]}else if(chartMode==='expenses'){
 const all=[...d.budget.map(x=>({name:x.name,amount:+x.amount||0,source:'Budget'})),...billsFor(S.month).map(x=>({name:x.name,amount:+x.amount||0,source:'Bill'}))];
 if(chartDrill)raw=all.filter(x=>expenseGroup(x.name)===chartDrill).map(x=>({name:x.name,amount:x.amount}));
 else {const totals=new Map();for(const x of all){let k=expenseGroup(x.name);totals.set(k,(totals.get(k)||0)+x.amount)}raw=[...totals].map(([name,amount])=>({name,amount,drill:true}));}
}else if(chartMode==='savings'){
 raw=S.categories.filter(c=>c.type==='savings').map(c=>({name:c.name,amount:amt(c,S.month)}));
}else{
 raw=[{name:'Pocket money remaining',amount:Math.max(0,sp.pocket-spentPocket())},{name:'Pocket money spent',amount:spentPocket()}];
}
raw=raw.filter(x=>x.amount>0).sort((a,b)=>b.amount-a.amount);const total=raw.reduce((a,x)=>a+x.amount,0),denom=Math.max(total,0.001);let angle=0;let stops=[];
raw.forEach((x,i)=>{let to=angle+(x.amount/denom)*100;stops.push(`${chartColors[i%chartColors.length]} ${angle.toFixed(4)}% ${to.toFixed(4)}%`);angle=to});
let chartBg=stops.length?`conic-gradient(${stops.join(',')})`:'#efe9ed';
return `<div class="card"><div class="chart-choice">${options.map(([key,label])=>`<button class="ghost ${chartMode===key?'active':''}" data-chartmode="${key}">${label}</button>`).join('')}</div>${chartDrill&&chartMode==='expenses'?`<button class="chart-back" data-chartback="1">← All expenses</button><div class="subhead">${safe(chartDrill)}</div>`:''}<div class="chart-donut" style="background:${chartBg}"><div class="chart-center"><small>${chartMode==='expenses'?(chartDrill?chartDrill:'Expenses'):chartMode==='savings'?'Planned savings':chartMode==='all'?'Overall':'Pocket money'}</small><b>${fmt(total)}</b></div></div><div class="chart-list">${raw.map((x,i)=>`<button class="chart-row" ${chartMode==='expenses'&&!chartDrill&&x.drill?'data-chartdrill="'+safe(x.name)+'"':''}><span><i class="dot" style="background:${chartColors[i%chartColors.length]}"></i><b>${safe(x.name)}</b>${chartMode==='expenses'&&!chartDrill?' ›':''}</span><span class="chart-number"><b>${fmt(x.amount)}</b><small>${total>0?(x.amount/total*100).toFixed(1):'0.0'}%</small></span></button>`).join('')||'<div class="sm">No entries for this month yet</div>'}</div></div>`}
function trendChart(rows){const values=rows.map(r=>r.saved),max=Math.max(1,...values),w=330,h=125,p=19;const pts=values.map((v,i)=>[p+i*(w-2*p)/Math.max(1,rows.length-1),h-p-v/max*(h-2*p)]);return `<svg viewBox="0 0 ${w} ${h}" class="sparkline" role="img" aria-label="Monthly savings trend line"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#e9dfe5"/><polyline fill="none" stroke="var(--rose)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(x=>x.join(',')).join(' ')}"/>${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="4.5" fill="var(--rose)"><title>${rows[i].month}: ${fmt(values[i])}</title></circle>`).join('')}</svg><div class="row">${rows.map(r=>`<span class="sm">${safe(r.month.slice(5))}</span>`).join('')}</div>`}
function overview(){let st=stats(),sp=split(),spent=spentPocket();let start=S.reportStart||S.month,end=S.reportEnd||S.month;if(start>end)[start,end]=[end,start];let range=months().filter(m=>m>=start&&m<=end);let totals={income:0,expenses:0,planned:0,actual:0,spending:0};let trend=range.map(m=>{let a=stats(m),s=split(m),trans=add(mdata(m).transfers);totals.income+=a.income;totals.expenses+=a.budget+a.billTotal;totals.planned+=s.save;totals.actual+=trans;totals.spending+=add(mdata(m).transactions);return{month:m,saved:trans}});let sections={};sections['Spending left']=`<div class="card hero"><div class="label">🍓 Left to spend</div><div class="money">${fmt(sp.pocket-spent)}</div><div class="bar"><i style="width:${sp.pocket>0?Math.max(0,Math.min(100,spent/sp.pocket*100)):0}%"></i></div><div class="sm">${fmt(spent)} spent of ${fmt(sp.pocket)}</div></div><div class="card"><div class="row"><span class="sm">Ready to split</span><b>${fmt(balance())}</b></div></div>`;sections.Summary=`<div class="grid"><div class="card"><div class="label">Income</div><div class="value">${fmt(st.income)}</div></div><div class="card"><div class="label">Expenses + bills</div><div class="value">${fmt(st.budget+st.billTotal)}</div></div><div class="card"><div class="label">Savings planned</div><div class="value">${fmt(sp.save)}</div></div><div class="card"><div class="label">Pocket money</div><div class="value">${fmt(sp.pocket)}</div></div></div>`;sections['Money chart']=moneyChart();sections['Savings jars']=`<div class="card">${S.categories.filter(c=>c.type==='savings').map(c=>`<div class="item"><div style="flex:1"><b>${safe(c.emoji)} ${safe(c.name)}</b><div class="sm">Accumulated: ${fmt(fundBalance(c))}</div></div><button class="micro" data-editcategory="${safe(c.id)}">✎</button></div>`).join('')}</div>`;sections['Monthly trends']=`<div class="card">${trend.length?trendChart(trend):'<div class="sm">No months in range</div>'}<div class="row"><span>Total savings deposited</span><b>${fmt(totals.act
