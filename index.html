const KEY='bloom-budget-v7', oldKey='bloom-budget-v1';
const uid=()=>Math.random().toString(36).slice(2,11);

const presets=[['Rent (for next month)',1700,1,1,''],['Car Insurance',314,13,1,''],['Necklace',214,12,1,''],['Phone Bill',55,20,1,''],['Angel Phone Line',55,22,1,''],['Ronnie Phone Line',32,22,1,''],['Gas · Mid-month',100,15,1,''],['Gas · Month-end',100,28,1,''],['Gym Membership',31,30,1,'']].map(([name,amount,day,repeat,end])=>({id:uid(),name,amount,day,repeat:!!repeat,end,activeFrom:'2026-11'}));
const sample={income:[{id:uid(),name:'Income A',amount:2700,date:'2026-11-05',period:1},{id:uid(),name:'Income R',amount:1500,date:'2026-11-19',period:2},{id:uid(),name:'Income A',amount:1500,date:'2026-11-19',period:2}],budget:[['CC Ronnie',1190,1],['CC Walmart',500,1],['CC Costco',200,1],['Tax Due',360,1]].map(([name,amount,period])=>({id:uid(),name,amount,period,date:'2026-11-08'})),transactions:[],payments:[],transfers:[],splitPct:80,opening:0};
const initial={month:'2026-11',tab:'overview',period:1,selectedDay:today(),categories:defaultCats,bills:presets,months:{'2026-11':sample},name:'Bloom Budget',labels:{cash:'Cash Flow',bills:'Bills & Calendar',split:'Money Split',overview:'Overview',more:'More',income:'Total income',expenses:'Budgeted expenses',available:'Ready to split',savings:'Savings & funds',spending:'Pocket money'},color:'#b57e9a',font:'system',sectionLabels:{},layout:['Spending left','Summary','Money chart','Savings jars','Monthly trends']};
let S;try{S=JSON.parse(localStorage.getItem(KEY))||null}catch{}if(!S)S=structuredClone(initial);
for(const k of Object.keys(initial))if(S[k]===undefined)S[k]=structuredClone(initial[k]);
if(!S.v11LayoutApplied){S.layout=['Spending left',...S.layout.filter(x=>x!=='Spending left')];S.tab='overview';S.v11LayoutApplied=true;}
const BASE_GROUPS=[['savings','Savings'],['bills','Bills'],['expense','Expenses'],['spending','Pocket spending']];
if(!S.categoryGroups)S.categoryGroups=BASE_GROUPS.map(([id,name])=>({id,name,base:id,hidden:false}));
function groupList(){return (S.categoryGroups||[]).filter(g=>g&&!g.hidden)}
function groupForCategory(c){return S.categoryGroups?.find(g=>g.id===c.groupId)||S.categoryGroups?.find(g=>g.id===c.type)}
function categoryGroupOptions(c){return groupList().filter(g=>g.base===(c?.type||'expense')).map(g=>`<option value="${safe(g.id)}" ${((c?.groupId||c?.type)===g.id)?'selected':''}>${safe(g.name)}</option>`).join('')}
function groupEditor(id){let g=S.categoryGroups.find(g=>g.id===id);if(!g)return;openSheet('Edit group',`<label>Group name</label><input id="groupRename" value="${safe(g.name)}"><div class="modalbuttons"><button class="btn" data-savegroup="${safe(id)}">Save</button><button class="quiet" data-hidegroup="${safe(id)}">${g.hidden?'Show group':'Hide heading'}</button>${!BASE_GROUPS.some(x=>x[0]===id)?`<button class="quiet danger" data-deletegroup="${safe(id)}">Remove group</button>`:''}</div>`)}

const $=q=>document.querySelector(q),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Number(n)||0),add=xs=>xs.reduce((a,x)=>a+(Number(x.amount)||0),0),mdata=(m=S.month)=>S.months[m]||(S.months[m]={income:[],budget:[],transactions:[],payments:[],transfers:[],splitPct:80,opening:0,autoSavingsEnabled:true,jarOverrides:{}});
const months=()=>Object.keys(S.months).sort();const nextMonth=m=>{let [y,mo]=m.split('-').map(Number);return new Date(Date.UTC(y,mo,1)).toISOString().slice(0,7)};const coverage=(b,m)=>/rent/i.test(b.name)?'For '+new Date(nextMonth(m)+'-01T12:00:00').toLocaleDateString('en-CA',{month:'long',year:'numeric'}):'';const amt=(c,m)=>{let d=mdata(m);return Math.max(0,balance(m))*((d.splitPct??80)/100)*c.weight/100};
function billDate(b,month){const max=new Date(+month.slice(0,4),+month.slice(5,7),0).getDate();return month+'-'+String(Math.min(max,b.day)).padStart(2,'0')}
function billsFor(month){return S.bills.filter(b=>(!b.activeFrom||month>=b.activeFrom)&&(!b.end||billDate(b,month)<=b.end)&&(!b.oneMonth||b.oneMonth===month))}
function stats(month=S.month){let d=mdata(month),income=add(d.income),budget=add(d.budget),due=billsFor(month),billTotal=due.reduce((s,b)=>s+b.amount,0),used=new Set(d.payments.map(p=>p.billId));return{income,budget,billTotal,paid:due.filter(b=>used.has(b.id)).reduce((s,b)=>s+(d.payments.find(p=>p.billId===b.id)?.amount??b.amount),0),pending:due.filter(b=>!used.has(b.id)).reduce((s,b)=>s+b.amount,0)}}
function previousMonth(m){const [y,mm]=m.split('-').map(Number);return new Date(Date.UTC(y,mm-2,1)).toISOString().slice(0,7)}
function carryForward(m,depth=0){if(depth>120)return 0;const prev=previousMonth(m);if(!S.months[prev])return 0;return remainingCash(prev,depth+1)}
function remainingCash(m,depth=0){const d=S.months[m];if(!d||depth>120)return 0;const st=stats(m);const opening=d.carryEnabled?carryForward(m,depth+1):Number(d.opening)||0;const extras=add(d.transactions||[]);const transfers=add(d.transfers||[]);return opening+st.income-st.budget-st.billTotal-extras-transfers}
function openingFor(m){const d=mdata(m);return d.carryEnabled?carryForward(m):Number(d.opening)||0}
function balance(month=S.month){let st=stats(month);return st.income+openingFor(month)-st.budget-st.billTotal}
function split(month=S.month){let available=Math.max(0,balance(month)),p=(mdata(month).splitPct??80)/100;return {save:available*p,pocket:available*(1-p)}}
function incomeIsReceived(t){if(t.status==='received')return true;if(t.status==='expected')return false;return !!t.date&&t.date<=[new Date().getFullYear(),String(new Date().getMonth()+1).padStart(2,'0'),String(new Date().getDate()).padStart(2,'0')].join('-')}
function monthConfirmedRatio(m){let d=mdata(m),total=add(d.income);if(total<=0)return 0;return Math.min(1,add(d.income.filter(incomeIsReceived))/total)}
function jarAutoAmount(c,m){const d=mdata(m);const override=d.jarOverrides?.[c.id];if(override && Number.isFinite(Number(override.amount)))return !override.date||override.date<=[new Date().getFullYear(),String(new Date().getMonth()+1).padStart(2,'0'),String(new Date().getDate()).padStart(2,'0')].join('-')?Number(override.amount):0;if(!d.autoSavingsEnabled)return 0;return Math.round(amt(c,m)*monthConfirmedRatio(m)*100)/100}
function jarProjectedAmount(c,m){const d=mdata(m),override=d.jarOverrides?.[c.id];if(override&&Number.isFinite(Number(override.amount)))return Number(override.amount);return amt(c,m)}
function jarDepositAmount(c,m){return jarAutoAmount(c,m)+add((mdata(m).transfers||[]).filter(t=>t.categoryId===c.id))}
function jarScheduledAmount(c,m){return Math.max(0,jarProjectedAmount(c,m)-jarAutoAmount(c,m))}
function autoSavingsTotal(m){return S.categories.filter(c=>c.type==='savings').reduce((n,c)=>n+jarAutoAmount(c,m),0)}
function receivedDateForJar(c,m){const d=mdata(m),o=d.jarOverrides?.[c.id];if(o?.date && Number(o.amount)>0)return o.date;if(!d.autoSavingsEnabled||jarAutoAmount(c,m)<=0)return '';let dates=d.income.filter(incomeIsReceived).map(x=>x.date).filter(Boolean).sort();return dates.length?dates[dates.length-1]:''}
function spentPocket(month=S.month){return add(mdata(month).transactions.filter(x=>x.kind==='spending'))}
function fundBalance(cat){return months().reduce((s,m)=>s+jarDepositAmount(cat,m),0)}
function toast(t){let n=$('#toast');n.textContent=t;n.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.style.display='none',2100)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{} if(window.BloomCloud?.queueSave)window.BloomCloud.queueSave(S)}
function title(s){return safe(S.labels[s]||s)}
function compactItem(name,date,amount,kind='',right=''){return `<div class="item"><div><div class="name">${safe(name)}</div><div class="sm">${safe(date)} ${right? '· '+safe(right):''}</div></div><div class="amount" style="color:${kind==='income'?'#4c8866':'inherit'}">${kind==='income'?'+':'−'}${fmt(amount)}</div></div>`}
const monthLabel=m=>new Date(m+'-01T12:00:00').toLocaleDateString('en-CA',{month:'short',year:'numeric'});
const humanDate=date=>date?new Date(date+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}):'No date';
function entryRow(x,kind){const incoming=kind==='income'||kind==='transfer'&&x.amount>0;return `<div class="item"><div style="flex:1;min-width:0"><div class="name">${safe(x.name||S.categories.find(c=>c.id===x.categoryId)?.name||'Entry')}</div><div class="sm">${humanDate(x.date)} · ${safe(x.subtype||(kind==='budget'?'Expense':kind==='transfer'?'Savings':kind==='income'?'Income':'Purchase'))}</div>${kind==='income'?`<button class="micro" data-toggleincome="${safe(x.id)}">${incomeIsReceived(x)?'✓ Received':'◷ Expected'}</button>`:''}</div><span class="amount ${incoming?'income':'expense'}">${incoming?'+':'−'}${fmt(Math.abs(x.amount))}</span><div class="bloom-actions"><button class="micro" data-editentry="${safe(x.id)}" data-entrykind="${kind}" aria-label="Edit entry">${ico("edit")} Edit</button><button class="micro danger" data-removeentry="${safe(x.id)}" data-entrykind="${kind}" aria-label="Delete entry">${ico("trash")} Delete</button></div></div>`}

function openSheet(title,html){let el=$('#bloomModal'),slot=$('#bloomSheet');slot.innerHTML=`<div class="modalhead"><h2>${safe(title)}</h2><button class="micro" data-closemodal="1" aria-label="Close">${ico("close")}</button></div>`+html;el.classList.remove('hidden');slot.querySelector('input:not([type=hidden]),select,button')?.focus({preventScroll:true})}

function allTypeLabels(){return S.entryTypes||{income:['Income'],budget:['Budgeted expense'],spending:['Everyday purchase'],transfer:['Savings transfer']}}

function editTypeLabels(){openSheet('Edit transaction types',`<div class="sm">Add / rename / remove labels per entry group.</div>${Object.entries(allTypeLabels()).map(([k,values])=>`<div class="group-label">${safe(k)}</div>${values.map((v,i)=>`<div class="entry"><input data-entrytypegroup="${safe(k)}" data-entrytypeindex="${i}" value="${safe(v)}"><button class="micro danger" data-removetype="${safe(k)}" data-typeindex="${i}">Delete</button></div>`).join('')}<button class="micro" data-newtype="${safe(k)}">＋ Add ${safe(k)} type</button>`).join('')}<div class="modalbuttons"><button class="btn" data-action="savetypes">Done</button></div>`)}
function formEntry(kind='budget',item=null){const names={income:typeLabel("income"),budget:typeLabel("budget"),spending:typeLabel("spending"),transfer:typeLabel("transfer")};let when=item?.date||S.month+'-'+String(S.period===1?5:20).padStart(2,'0');openSheet(item?'Edit '+(names[kind]||'entry'):'New transaction',`<input type="hidden" id="modalEntryId" value="${safe(item?.id||'')}"><div class="pair"><div><label>Type</label><select id="entryType">${Object.entries(names).map(([k,v])=>`<option value="${k}" ${kind===k?'selected':''}>${v}</option>`).join('')}</select></div><div><label>Amount</label><input type="number" id="entryAmount" min="0" step="0.01" value="${item?.amount??''}" placeholder="0.00"></div></div><div id="entrySubType"><label>Custom type</label><select id="entrySubtype">${(allTypeLabels()[kind]||[names[kind]]).map(v=>`<option value="${safe(v)}" ${item?.subtype===v?'selected':''}>${safe(v)}</option>`).join('')}</select></div><div id="modalEntryName"><label>Transaction title</label><input id="entryName" value="${safe(item?.name||'')}" placeholder="e.g. Salary, coffee, groceries"></div><div id="fundSelect" class="${kind==='transfer'?'':'hidden'}"><label>Savings jar</label><select id="entryFund">${S.categories.filter(c=>c.type==='savings').map(c=>`<option value="${safe(c.id)}" ${item?.categoryId===c.id?'selected':''}>${safe(c.name)}</option>`).join('')}</select></div><div id="incomeReceiveMode" class="${kind==='income'?'':'hidden'}"><label>Income status</label><select id="incomeStatus"><option value="auto" ${!item||!item.status||item.status==='auto'?'selected':''}>Auto on scheduled date</option><option value="received" ${item?.status==='received'?'selected':''}>Received now</option><option value="expected" ${item?.status==='expected'?'selected':''}>Expected — not received</option></select></div><div class="pair"><div><label>Date</label><input id="entryDate" type="date" value="${safe(when)}"></div><div><label>Pay period</label><select id="entryPeriod"><option value="1" ${item?.period===1||!item&&S.period===1?'selected':''}>First pay</option><option value="2" ${item?.period===2||!item&&S.period===2?'selected':''}>Second pay</option></select></div></div><div class="modalbuttons"><button type="button" class="btn" data-action="addentry">${item?'Save changes':'Add entry'}</button><button class="quiet" data-closemodal="1">Cancel</button></div>`);}

function cardLabel(k,defaultName){return safe((S.cardLabels||{})[k]||defaultName)}
function renameCard(k,defaultName){return `<button class="card-title-btn" data-renamecard="${safe(k)}" data-carddefault="${safe(defaultName)}" title="Tap to rename">${cardLabel(k,defaultName)} <small>✎</small></button>`}
function selectedRange(){let start=S.reportStart||S.month,end=S.reportEnd||S.month;if(start>end)[start,end]=[end,start];return {start,end,range:months().filter(m=>m>=start&&m<=end)}}
function sumJarAcross(c,range){return range.reduce((n,m)=>n+amt(c,m),0)}
function actualJarAcross(c,range){return range.reduce((n,m)=>n+jarDepositAmount(c,m),0)}
function latestJarDate(c,range){let items=[];for(const m of range){const a=receivedDateForJar(c,m);if(a)items.push(a);for(const t of mdata(m).transfers.filter(x=>x.categoryId===c.id&&x.date))items.push(t.date)}items.sort();return items.length?items[items.length-1]:""}
function prettyMonth(m){return new Date(m+"-01T12:00").toLocaleDateString("en-CA",{month:"short",year:"numeric"})}
function prettyShort(d){return d?new Date(d+"T12:00").toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"}):""}
function topRangeText(){let {start,end}=selectedRange();return start===end?prettyMonth(start):`${prettyMonth(start)} – ${prettyMonth(end)}`}
function chartSeries(rows){const paths=[['income','Income','#2e9d6b'],['expenses','Expenses + bills','#c75f70'],['spending','Spending','#d5a05e'],['planned','Savings plan','#8279c3'],['saved','Allocated savings','#49a3b8']];const w=360,h=170,left=38,right=9,top=12,bottom=28;const max=Math.max(1,...rows.flatMap(r=>paths.map(p=>r[p[0]])));const x=i=>left+i*(w-left-right)/Math.max(1,rows.length-1);const y=v=>h-bottom-v/max*(h-bottom-top);const lines=[0,.5,1].map(t=>`<line x1="${left}" y1="${y(max*t)}" x2="${w-right}" y2="${y(max*t)}" stroke="#eee5ec"/><text x="${left-5}" y="${y(max*t)+3}" fill="#867c85" text-anchor="end" font-size="9">${Math.round(max*t/100)/10}k</text>`).join('');const curves=paths.map(([k,label,color])=>`<polyline fill="none" stroke="${color}" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" points="${rows.map((r,i)=>x(i)+','+y(r[k])).join(' ')}"/>${rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r[k])}" r="3.2" fill="${color}"><title>${safe(r.month)} · ${label}: ${fmt(r[k])}</title></circle>`).join('')}`).join('');return `<div class="trend-legend">${paths.map(([k,l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join('')}</div><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Income expenses savings spending monthly line chart" style="width:100%;height:auto;display:block">${lines}${curves}${rows.map((r,i)=>`<text x="${x(i)}" y="${h-8}" font-size="10" fill="#867c85" text-anchor="middle">${safe(monthLabel(r.month).split(' ')[0])}</text>`).join('')}</svg>`}

function cash(){let d=mdata(),st=stats();let all=[...d.income.map(x=>({...x,kind:'income'})),...d.budget.map(x=>({...x,kind:'budget'})),...d.transactions.map(x=>({...x,kind:'spending'})),...d.transfers.map(x=>({...x,kind:'transfer'}))];all=all.filter(x=>S.period===0||x.period===S.period).sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<div class="card hero"><div class="label">${renameCard("cashBalance","Cash Flow")} · ${monthLabel(S.month)}</div><div class="money">${fmt(balance())}</div><div class="mini-total"><div class="card"><div class="label">${renameCard("cashIncome","Total income")}</div><div class="value" style="color:var(--in)">${fmt(st.income)}</div></div><div class="card"><div class="label">${renameCard("cashExpenses","Bills + expenses")}</div><div class="value" style="color:var(--out)">${fmt(st.budget+st.billTotal)}</div></div></div></div><div class="row"><div class="filter-row">${[[0,'All pay periods'],[1,'First pay'],[2,'Second pay']].map(([n,t])=>`<button class="${S.period===n?'btn':'ghost'}" data-period="${n}">${t}</button>`).join('')}</div></div><div class="row">${renameCard("cashTransactions","Transactions · Latest first")}<span class="bloom-actions"><button class="micro" data-edittype="1">${ico("filter")} Types</button><button class="btn" data-newentry="budget">${ico("plus")} Add</button></span></div><div class="card">${all.map(x=>entryRow(x,x.kind)).join('')||'<span class="sm">Nothing recorded yet</span>'}</div><div class="card"><div class="row" style="gap:10px"><div style="flex:1"><b>Carry over last month</b><div class="sm">${monthLabel(previousMonth(S.month))} → ${monthLabel(S.month)}</div></div><label class="carry-switch"><input type="checkbox" data-carry="1" ${d.carryEnabled?'checked':''} aria-label="Carry over last month remaining balance"><span></span></label></div><div class="row"><span class="sm">${d.carryEnabled?'Calculated previous-month remainder':'Carryover not included'}</span><b>${fmt(d.carryEnabled?carryForward(S.month):0)}</b></div>${d.carryEnabled&&!S.months[previousMonth(S.month)]?'<div class="sm">No previous month entered yet</div>':''}<div class="sm">Based on planned bills and recorded purchases / savings transfers</div></div>`}
function bills(){let d=mdata(),bs=billsFor(S.month),st=stats(), selected=(S.selectedDay||S.month+'-01');if(!selected.startsWith(S.month))selected=S.month+'-01';let [y,mm]=S.month.split('-').map(Number),first=(new Date(y,mm-1,1).getDay()+6)%7,days=new Date(y,mm,0).getDate(),cells=Array.from({length:first},()=>'<div class="day empty"></div>');for(let day=1;day<=days;day++){let date=S.month+'-'+String(day).padStart(2,'0'),due=bs.filter(b=>billDate(b,S.month)===date),purchases=d.transactions.filter(t=>t.date===date);cells.push(`<button class="day ${selected===date?'selected':''}" data-day="${date}"><b>${day}</b>${due.length?'<i></i>':''}${purchases.length?'<i style="background:#8dbb9d"></i>':''}<small>${due.length||purchases.length?due.length+purchases.length+' items':''}</small></button>`)}let dayBills=bs.filter(b=>billDate(b,S.month)===selected),dayTx=d.transactions.filter(t=>t.date===selected),paid=b=>d.payments.find(p=>p.billId===b.id);return `<div class="row">${renameCard("dueSoon","Due soon")}<span class="pill">Upcoming payments</span></div><div class="card">${bs.filter(b=>!d.payments.some(p=>p.billId===b.id)).sort((a,b)=>a.day-b.day).slice(0,4).map(b=>`<div class="item"><span>📌</span><div style="flex:1"><b>${safe(b.name)}</b><div class="sm">${humanDate(billDate(b,S.month))}</div></div><b>${fmt(b.amount)}</b></div>`).join('')||'<span class="sm">All set!</span>'}</div><div class="grid"><div class="card hero"><div class="label">${renameCard("billsPending","Still to pay")}</div><div class="value">${fmt(st.pending)}</div></div><div class="card"><div class="label">${renameCard("billsPaid","Paid bills")}</div><div class="value">${fmt(st.paid)}</div></div></div><div class="card"><div class="row"><b>📅 ${new Date(S.month+'-01T12:00').toLocaleDateString('en-CA',{month:'long',year:'numeric'})}</b><span class="sm">● due · <span style="color:#8dbb9d">●</span> purchase</span></div><div class="calendar">${['M','T','W','T','F','S','S'].map(n=>`<div class="sm">${n}</div>`).join('')}${cells.join('')}</div></div><div class="card"><h2 style="margin-top:0">${selected}</h2>${dayBills.map(b=>`<div class="item"><input type="checkbox" data-paid="${safe(b.id)}" ${paid(b)?'checked':''}><div style="flex:1"><b>${safe(b.name)}</b><div class="sm">${paid(b)?'Paid':'Pending'} · ${fmt(b.amount)} ${coverage(b,S.month)?' · '+coverage(b,S.month):''}</div></div><button class="quiet" data-editbill="${safe(b.id)}">✎</button></div>`).join('')}${dayTx.map(t=>compactItem(t.name,t.date,t.amount,'expense','Purchase')).join('')}${!dayBills.length&&!dayTx.length?'<div class="sm">No activity on this day</div>':''}</div><div class="row"><h2 style="margin:0">${renameCard("scheduledBills","All scheduled bills")}</h2><button class="ghost" data-action="showbill">＋ Add bill</button></div><div class="card">${bs.slice().sort((a,b)=>a.day-b.day).map(b=>`<div class="item"><input type="checkbox" data-paid="${safe(b.id)}" ${paid(b)?'checked':''}><div style="flex:1"><b>${safe(b.name)}</b><div class="sm">Every ${b.day}${b.repeat?' · Monthly':' · One-time'} ${b.end?' · Until '+b.end:''} ${coverage(b,S.month)?' · '+coverage(b,S.month):''}</div></div><div style="text-align:right"><div class="amount">${fmt(b.amount)}</div><div class="bloom-actions"><button class="micro" data-editbill="${safe(b.id)}">✎</button><button class="micro danger" data-removebill="${safe(b.id)}">×</button></div></div></div>`).join('')}</div>`}function splitView(){let d=mdata(),av=balance(),sp=split(),valid=S.categories.filter(c=>c.type==='savings'),total=valid.reduce((s,c)=>s+(+c.weight||0),0),{range}=selectedRange();return `<div class="card hero"><div class="label">${renameCard('readySplit','🌷 Ready to split')}</div><div class="money">${fmt(av)}</div></div><div class="grid"><div class="card"><div class="label">${renameCard('splitSavings','🌿 Total savings')}</div><div class="value">${fmt(sp.save)}</div></div><div class="card"><div class="label">${renameCard('splitPocket','🍓 Pocket money')}</div><div class="value">${fmt(sp.pocket-spentPocket())}</div></div></div><div class="card"><div class="row"><b>${renameCard('savingsPercent','Savings allocation')}</b><button class="micro" data-editsplit="1">${d.splitPct??80}% ${ico("edit")}</button></div><div class="bar"><i style="width:${d.splitPct??80}%"></i></div><div class="row"><span class="sm">${fmt(sp.save)} savings</span><span class="sm">${fmt(sp.pocket)} pocket</span></div></div><div class="card"><div class="row" style="margin:0"><div><b>Auto savings</b><div class="sm">${d.autoSavingsEnabled?'On · updates with income dates':'Off · manual transfers only'}</div></div><label class="carry-switch"><input type="checkbox" data-autosavings="1" ${d.autoSavingsEnabled?'checked':''} aria-label="Automatically allocate savings"><span></span></label></div></div><div class="row"><b>${renameCard('jarTitle','Savings jars')} 🌸</b><button class="micro" data-addcategory="1">${ico("plus")} Add jar</button></div><div class="card"><div class="sm">${total}% of savings distributed · In-app allocations, not bank transfers</div>${valid.map(c=>`<div class="jar-tile"><span class="jar-visual">${ico('jar')}<span class="jar-mini">${safe(c.emoji||'🌱')}</span></span><div style="min-width:0;flex:1"><b>${safe(c.name)}</b><div class="sm">${latestJarDate(c,range)?'Latest allocation: '+prettyShort(latestJarDate(c,range)):'No allocation yet'}</div><div class="sm">${c.weight||0}% of savings</div></div><div style="text-align:right"><div class="jar-amount">${fmt(jarAutoAmount(c,S.month))}</div><div class="sm">${fmt(jarScheduledAmount(c,S.month))} scheduled</div><button class="micro" data-editjaramount="${safe(c.id)}">${ico('edit')} Amount</button><button class="micro" data-editcategory="${safe(c.id)}">Edit jar</button></div></div>`).join('')}</div>`} 

let chartMode='all',chartDrill='';
const chartColors=['#be88a7','#74b9a0','#e7b96e','#7ba4cd','#a896c8','#db8a83','#77bfc3','#a8b66b','#d2aaa0','#869cbd','#d6b3c5'];
function expenseGroup(name){let n=(name||'').toLowerCase();if(/\bcc\b|credit card|walmart|costco/.test(n))return 'Credit Cards';if(/rent/.test(n))return 'Rent';if(/phone|mobile|internet/.test(n))return 'Phone & Internet';if(/car insurance|insurance/.test(n))return 'Insurance';if(/gas|fuel|petrol/.test(n))return 'Gas & Transport';if(/gym|fitness/.test(n))return 'Gym & Fitness';if(/necklace|jewelry/.test(n))return 'Installments';if(/tax/.test(n))return 'Taxes';if(/grocery|groceries/.test(n))return 'Groceries';let c=S.categories.find(c=>c.type==='expense'&&c.name.toLowerCase()===n);return c?.name||'Other Expenses'}
function moneyChart(){let {range}=selectedRange(),options=[['all','Overall'],['expenses','Expenses'],['savings','Savings'],['spending','Pocket']];let raw=[];
if(chartMode==='all'){raw=[{name:'Expenses + bills',amount:range.reduce((n,m)=>{let a=stats(m);return n+a.budget+a.billTotal},0)},{name:'Planned savings',amount:range.reduce((n,m)=>n+split(m).save,0)},{name:'Pocket allocation',amount:range.reduce((n,m)=>n+split(m).pocket,0)}]}
else if(chartMode==='expenses'){const all=range.flatMap(m=>[...mdata(m).budget.map(x=>({name:x.name,amount:+x.amount||0})),...billsFor(m).map(x=>({name:x.name,amount:+x.amount||0}))]);if(chartDrill){const totals=new Map();for(const x of all.filter(x=>expenseGroup(x.name)===chartDrill))totals.set(x.name,(totals.get(x.name)||0)+x.amount);raw=[...totals].map(([name,amount])=>({name,amount}))}else{const totals=new Map();for(const x of all){const k=expenseGroup(x.name);totals.set(k,(totals.get(k)||0)+x.amount)}raw=[...totals].map(([name,amount])=>({name,amount,drill:true}))}}
else if(chartMode==='savings'){raw=S.categories.filter(c=>c.type==='savings').map(c=>({name:c.name,amount:sumJarAcross(c,range)}))}
else {let pocket=range.reduce((n,m)=>n+split(m).pocket,0),spent=range.reduce((n,m)=>n+spentPocket(m),0);raw=[{name:'Pocket money left',amount:Math.max(0,pocket-spent)},{name:'Pocket spent',amount:spent}]}
raw=raw.filter(x=>x.amount>0).sort((a,b)=>b.amount-a.amount);const total=raw.reduce((n,x)=>n+x.amount,0),denom=Math.max(total,.001);let angle=0,stops=[];raw.forEach((x,i)=>{let to=angle+x.amount/denom*100;stops.push(`${chartColors[i%chartColors.length]} ${angle.toFixed(4)}% ${to.toFixed(4)}%`);angle=to});const bg=stops.length?`conic-gradient(${stops.join(',')})`:'#efe9ed';return `<div class="card"><div class="chart-choice">${options.map(([k,l])=>`<button class="ghost ${chartMode===k?'active':''}" data-chartmode="${k}">${l}</button>`).join('')}</div>${chartDrill&&chartMode==='expenses'?`<button class="chart-back" data-chartback="1">← Expenses</button>`:''}<div class="chart-donut" style="background:${bg}"><div class="chart-center"><small>${chartMode==='all'?'Overall':chartMode==='expenses'?(chartDrill||'Expenses'):chartMode==='savings'?'Savings':'Pocket'}</small><b>${fmt(total)}</b></div></div><div class="chart-list">${raw.map((x,i)=>`<button class="chart-row" ${chartMode==='expenses'&&!chartDrill&&x.drill?'data-chartdrill="'+safe(x.name)+'"':''}><span><i class="dot" style="background:${chartColors[i%chartColors.length]}"></i><b>${safe(x.name)}</b>${x.drill?' ›':''}</span><span class="chart-number"><b>${fmt(x.amount)}</b><small>${(x.amount/denom*100).toFixed(1)}%</small></span></button>`).join('')||'<div class="sm">No entries in range</div>'}</div></div>`}

function trendChart(rows){const values=rows.map(r=>r.saved),max=Math.max(1,...values),w=330,h=125,p=19;const pts=values.map((v,i)=>[p+i*(w-2*p)/Math.max(1,rows.length-1),h-p-v/max*(h-2*p)]);return `<svg viewBox="0 0 ${w} ${h}" class="sparkline" role="img" aria-label="Monthly savings trend line"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#e9dfe5"/><polyline fill="none" stroke="var(--rose)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(x=>x.join(',')).join(' ')}"/>${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="4.5" fill="var(--rose)"><title>${rows[i].month}: ${fmt(values[i])}</title></circle>`).join('')}</svg><div class="row">${rows.map(r=>`<span class="sm">${safe(r.month.slice(5))}</span>`).join('')}</div>`}
function overview(){let st=stats(),sp=split(),spent=spentPocket();let {start,end,range}=selectedRange();let totals={income:0,expenses:0,planned:0,actual:0,spending:0,pocket:0};let trend=range.map(m=>{let a=stats(m),q=split(m),actual=S.categories.filter(c=>c.type==='savings').reduce((n,c)=>n+jarDepositAmount(c,m),0),spending=add(mdata(m).transactions);totals.income+=a.income;totals.expenses+=a.budget+a.billTotal;totals.planned+=q.save;totals.actual+=actual;totals.spending+=spending;totals.pocket+=q.pocket;return{month:m,income:a.income,expenses:a.budget+a.billTotal,spending,planned:q.save,saved:actual}});let sections={};sections['Spending left']=`<div class="card hero"><div class="label">${renameCard('spendLeft','🍓 Left to spend')}</div><div class="money">${fmt(totals.pocket-totals.spending)}</div><div class="bar"><i style="width:${totals.pocket>0?Math.max(0,Math.min(100,totals.spending/totals.pocket*100)):0}%"></i></div><div class="sm">${fmt(totals.spending)} spent · ${fmt(totals.pocket)} allocated</div></div>`;sections.Summary=`<div class="grid">${[['summaryIncome','Income',totals.income],['summaryExpenses','Expenses + bills',totals.expenses],['summaryPlanned','Planned savings',totals.planned],['summaryPocket','Pocket money',totals.pocket]].map(([k,l,n])=>`<div class="card"><div class="label">${renameCard(k,l)}</div><div class="value">${fmt(n)}</div></div>`).join('')}</div>`;sections['Money chart']=moneyChart();sections['Savings jars']=`<div class="card">${S.categories.filter(c=>c.type==='savings').map(c=>`<div class="item"><span class="jar-visual">${ico('jar')}<span class="jar-mini">${safe(c.emoji||'🌱')}</span></span><div style="flex:1;min-width:0"><b>${safe(c.name)}</b><div class="sm">${latestJarDate(c,range)?'Latest allocation · '+prettyShort(latestJarDate(c,range)):'No allocation yet'}</div></div><div class="jar-amount">${fmt(actualJarAcross(c,range))}</div></div>`).join('')}</div>`;sections['Monthly trends']=`<div class="card">${trend.length?chartSeries(trend):'<div class="sm">No months in range</div>'}</div>`;return `<div class="range-context"><span>${range.length} month${range.length===1?'':'s'} selected</span><button class="micro" data-reset-range="1">This month</button></div>${S.layout.filter(k=>k!=='Ready to split').map(k=>sectionHeader(k)+(sections[k]||'')).join('')}`}

function more(){return `<div class="card"><h2 style="margin:0">Personalize</h2><label>App name</label><input data-appname value="${safe(S.name)}"><label>Pastel palette</label><div class="pastel-picker">${[['Dusty rose','#c898af'],['Sage','#9dbba6'],['Powder blue','#a0b9d9'],['Lilac','#afa2d7'],['Apricot','#e3b29d'],['Blush','#dbaabb'],['Mint','#9ecdc0'],['Lavender','#c2addb']].map(([n,c])=>`<button class="palette-chip" data-palette="${c}" style="--swatch:${c}"><i></i>${safe(n)}</button>`).join('')}</div><label>Custom accent</label><input type="color" data-color value="${safe(S.color)}"><label>Font</label><select data-font>${[['system','Default'],['pt','PT Sans style'],['nunito','Nunito style'],['quicksand','Quicksand style'],['poppins','Poppins style'],['inter','Inter style'],['lato','Lato style'],['rubik','Rubik style'],['karla','Karla style'],['mulish','Mulish style'],['work','Work Sans style']].map(([k,n])=>`<option value="${k}" ${S.font===k?'selected':''}>${n}</option>`).join('')}</select></div><div class="card"><div class="row"><h2 style="margin:0">Category groups</h2><button class="btn" data-newgroup="1">${ico('plus')} Group</button></div><div class="row"><span class="sm">Categories and their groups</span><button class="ghost" data-addcategory="1">${ico('plus')} Category</button></div>${groupList().map(g=>`<div class="group-panel"><div class="group-heading"><b>${safe(g.name)}</b><span class="mini-status">${g.base==='bills'?'Bills':g.base==='expense'?'Expenses':g.base==='savings'?'Savings':'Spending'}</span><button class="micro" data-editgroup="${safe(g.id)}">${ico('edit')} Edit</button></div>${S.categories.filter(c=>(c.groupId||c.type)===g.id).map(c=>`<div class="group-category"><span class="category-emoji">${safe(c.emoji||'🌸')}</span><b>${safe(c.name)}</b><button class="micro" data-editcategory="${safe(c.id)}">${ico('edit')}</button><button class="micro danger" data-delcat="${safe(c.id)}">${ico('trash')}</button></div>`).join('')||'<div class="sm">No categories</div>'}</div>`).join('')}<div class="sm">Hidden headings: ${S.categoryGroups.filter(g=>g.hidden).map(g=>`<button class="micro" data-editgroup="${safe(g.id)}">${safe(g.name)} · Show</button>`).join(' ')||'None'}</div></div><div class="card"><h2>Tabs & labels</h2>${Object.entries(S.labels).map(([key,value])=>`<div class="settings-row"><span class="sm">${safe(key)}</span><input data-label="${safe(key)}" value="${safe(value)}"></div>`).join('')}</div><div class="card" id="shared-account-card"><h2 style="margin-top:0">Shared household ☁️</h2><div id="shared-ui">Cloud setup needed. Local mode is ready.</div></div><div class="card"><h2 style="margin-top:0">Backup & sharing</h2><div class="row"><button class="btn" data-action="export">Export data</button></div><label>Import a backup</label><input id="import" type="file" accept="application/json"></div>`}

document.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(t.id==='monthPicker'){if(!/^\d{4}-\d{2}$/.test(t.value))return;S.month=t.value;mdata();S.selectedDay=S.month+'-01';chartDrill=''}else if(t.id==='entryType'){let trans=t.value==='transfer';$('#modalEntryName')?.classList.toggle('hidden',trans);$('#fundSelect')?.classList.toggle('hidden',!trans);return}else if(d.paid!==undefined){let m=mdata(),b=S.bills.find(x=>x.id===d.paid);m.payments=m.payments.filter(x=>x.billId!==d.paid);if(t.checked&&b)m.payments.push({billId:b.id,amount:b.amount,date:S.month+'-'+String(Math.min(b.day,new Date(+S.month.slice(0,4),+S.month.slice(5,7),0).getDate())).padStart(2,'0')})}
